# Test cases for webagent. Format: docs/WEBAGENT-FOLDER.md in the webagent-plugins repo (the dashboard and CI read the same file).
# Plain language only. No passwords or keys here: signed-in cases use the vault namespace in `credentials`.
version: 1
name: My app smoke tests

targets:
  local: http://localhost:3000        # a local URL is reached through a tunnel the agent opens
  staging:
    url: https://staging.example.com
    credentials: staging              # webagent vault namespace for this site's test login (optional)

# defaultTarget: staging              # optional: one of the targets above (default: the first)
# key: my-app-smoke                   # optional slug: CI updates the same workflow by it
# engine: qa                          # optional: any engine in your project (short name or id, yours too); omitted: the project default engine

cases:
  - id: home-loads
    title: The home page loads and its links work
    expect: shows "<a heading or word that is always on the home page>"
    # A value that contains ": " (colon, space) must be quoted as a whole, or the file is invalid YAML:
    #   expect: 'shows "Total: $19.00"'      (not: expect: shows "Total: $19.00")
    tags: [smoke]
    priority: 1

  - id: signup-happy
    title: A new user can sign up
    path: /signup
    steps:
      - type "qa+{{uid}}@example.com" into Email       # {{uid}}: a new value each run, so the email is unique
      - type "Throwaway-{{uid}}-pw1" into Password     # a throwaway value for a new account, never a real password
      - click "Create account"
    expect: address contains /dashboard and shows "Welcome"
    tags: [smoke, auth]
    priority: 1

  - id: signup-bad-email
    title: Signup rejects an invalid email
    path: /signup
    steps:
      - type "not-an-email" into Email
      - click "Create account"
    checks:                           # exact form of `expect`; wins over it when both are set
      text: valid email
      url: /signup
    tags: [auth, validation]
    priority: 2

  - id: dashboard-signed-in
    title: A signed-in user sees the dashboard
    path: /login
    signedIn: true                    # needs the target's vault login: the plugin runs it as a goal; workflow runs skip it
    expect: shows "<the user's name>"
    tags: [auth]
    # priority: 3                     # 1 (most important) to 5; default 3
