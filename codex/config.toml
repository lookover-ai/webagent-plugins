# Add to ~/.codex/config.toml (all projects) or .codex/config.toml in a trusted project.
#
# Sign in with Lookover (browser, no key): after adding this block run once
#   codex mcp login webagent
# A browser opens, you sign in, pick the project and approve. Codex keeps and renews the sign-in.
# Check with `codex mcp get webagent`; sign out with `codex mcp logout webagent`.
#
# Until production is live the staging host is the only live one. Replace the url when your team gives you another.

[mcp_servers.webagent]
url = "https://webagent-staging-in-api.lookover.ai/mcp"
startup_timeout_sec = 20
# smoke_test waits up to 60 s and run_task up to 90 s for one answer. Codex's default tool timeout is 60 s,
# which would cut a normal test short, so raise it.
tool_timeout_sec = 120

# CI or a machine without a browser: use an API key instead of signing in. Set the key in the shell that starts
# Codex (export WEBAGENT_API_KEY=wa_...; never write the key in this file), and use this block INSTEAD of the one
# above (comment that out, remove the leading "# " here).
# [mcp_servers.webagent]
# url = "https://webagent-staging-in-api.lookover.ai/mcp?auth=key"
# bearer_token_env_var = "WEBAGENT_API_KEY"
# startup_timeout_sec = 20
# tool_timeout_sec = 120

# QA only (optional): the same api, only the four QA tools (qa_run, qa_status, qa_report, qa_quick_check) and no
# browse tools. Use it INSTEAD of the block above (two servers would both offer qa_run), then `codex mcp login webagent`
# again. To switch: comment out [mcp_servers.webagent] above and remove the leading "# " here.
# [mcp_servers.webagent]
# url = "https://webagent-staging-in-api.lookover.ai/mcp/qa"
# startup_timeout_sec = 20
# tool_timeout_sec = 120
